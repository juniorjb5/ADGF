# <i class="fas fa-upload" role="presentation" aria-label="upload icon"></i> Standard Deviation




.pull-left[


&lt;br&gt;
&lt;br&gt;
&lt;br&gt;

### `$$\sigma =  \sqrt{ \frac{\sum_{t=1}^{n} (x_i - \bar{x})^2}{n}}$$`



]


.pull-right[



* `\(x_i\)` es el retorno mensual de cada portafolio.

&lt;br&gt;

* `\(\bar{x}\)` es el promedio mensual del retorno de los portafolios.

&lt;br&gt;

* `\(n\)` es el número de observaciones

&lt;br&gt;

&gt; La desviación estándar mide el grado en que los rendimientos de una cartera se dispersan alrededor de su media. Si los rendimientos están más dispersos, la cartera tiene una desviación estándar más alta y se considera más riesgosa o más volátil

]


---



# <i class="fas fa-upload" role="presentation" aria-label="upload icon"></i> Standard Deviation `xts`


.pull-left[

En el paradigma `xts`, podemos usar la función `StdDev()` integrada de `PerformanceAnalytics` para pasar directamente de la rentabilidad de los activos a la desviación estándar de la cartera. Toma dos argumentos, un vector de retornos y pesos: `StdDev(asset_returns_xts, weights = w)`.

&lt;br&gt;
&lt;br&gt;

&gt; Por favor genere los objetos necesarios para crear `asset_returns_xts`, replique los códigos de la clase anterior.



]


.pull-right[



```r
portfolio_sd_xts_builtin &lt;-
           StdDev(asset_returns_xts, weights = w)
           portfolio_sd_xts_builtin_percent &lt;-
           round(portfolio_sd_xts_builtin * 100, 2)
           portfolio_sd_xts_builtin_percent[1,1]
```



]


---



# <i class="fas fa-upload" role="presentation" aria-label="upload icon"></i> Standard Deviation `tidyverse`


.pull-left[

Para `tidyverse`, empezamos con `portfolio_returns_dplyr_byhand` y use las funciones `summarise()` y `sd()`. 

También realizaremos el cálculo con nuestra propia ecuación `sqrt(sum((returns - mean(returns))ˆ2)/(nrow(.)-1)))` como un ejemplo de cómo poner una ecuación personalizada en `summarise()`

&lt;br&gt;
&lt;br&gt;

&gt; Por favor genere los objetos necesarios para crear `portfolio_returns_dplyr_byhand`, replique los códigos de la clase anterior.



]


.pull-right[



```r
portfolio_sd_tidy_builtin_percent &lt;-
            portfolio_returns_dplyr_byhand %&gt;%
            summarise(
            sd = sd(returns),
            sd_byhand =
            sqrt(sum((returns - mean(returns))^2)/(nrow(.)-1))) %&gt;%
            mutate(dplyr = round(sd, 4) * 100,
            dplyr_byhand = round(sd_byhand, 4) * 100)
            portfolio_sd_tidy_builtin_percent %&gt;%
            select(dplyr, dplyr_byhand)
```



]


---



# <i class="fas fa-upload" role="presentation" aria-label="upload icon"></i> Standard Deviation `tidyquant`


.pull-left[

En el flujo `tidyquant`, comenzamos con `portfolio_returns_tq_rebalanced_monthly` y llamamos la función `table.Stats()` de `PerformanceAnalytics` a través de `tq_performance()`. 

La función `table.Stats()` devuelve una tabla de estadísticas para la cartera, pero dado que solo queremos una desviación estándar, usaremos `dplyr` para seleccionar la columna `Stdev`.

&lt;br&gt;
&lt;br&gt;

&gt; Por favor genere los objetos necesarios para crear `portfolio_returns_tq_rebalanced_monthly`, replique los códigos de la clase anterior.



]


.pull-right[



```r
portfolio_sd_tidyquant_builtin_percent &lt;-
            portfolio_returns_tq_rebalanced_monthly %&gt;%
            tq_performance(Ra = returns,
            Rb = NULL,
            performance_fun = table.Stats) %&gt;%
            select(Stdev) %&gt;%
            mutate(tq_sd = round(Stdev, 4) * 100)
```



]

# <i class="fas fa-upload" role="presentation" aria-label="upload icon"></i> Standard Deviation `(Visualization)`



.pull-left[


* Primero, crearemos un indicador para el rendimiento medio con `mean()` y uno para la desviación estándar con `sd()`. Llamaremos a las variables `mean_plot` y `sd_plot` ya que planeamos usarlas en un gráfico y no para nada más.

            hist_col_green =

            returns, as.numeric(NA)),

# <i class="fas fa-broom" role="presentation" aria-label="broom icon"></i> Rolling Standard Deviation



.pull-left[

&lt;br&gt;

### Hemos calculado la volatilidad promedio para toda la vida de la cartera, pero ayudaría si pudiéramos comprender mejor cómo ha cambiado esa volatilidad con el tiempo o cómo se comportó en diferentes condiciones de mercado.





]

.pull-right[

&lt;br&gt;

.center[
Podríamos perdernos un período de 3 o 6 meses en el que la volatilidad se disparó o se desplomó o hizo ambas cosas. Y cuanto más larga sea la vida de nuestra cartera, más probable será que nos perdamos algo importante. Si tuviéramos 10 o 20 años de datos y calculáramos la desviación estándar para toda la historia, podríamos, o seguramente no notaríamos, un período en el que la volatilidad fue muy alta y, por lo tanto, no ponderaríamos la probabilidad de que podría volver a ocurrir.
]

]

# <i class="fas fa-broom" role="presentation" aria-label="broom icon"></i> Rolling Standard Deviation `xts`



.pull-left[

El mundo `xts` está diseñado específicamente para series temporales y, como tal, calcular la desviación estándar móvil es sencillo.


Primero, asignamos un valor de 24 a la ventana variable



```r
window &lt;- 24
```


Luego invocamos `rollapply()`, le pasamos nuestro objeto de retorno `xts`, la función `sd()` y una ventana móvil con `width = window`.




]

.pull-right[



```r
window &lt;- 24

port_rolling_sd_xts &lt;-
      rollapply(portfolio_returns_xts_rebalanced_monthly,
      FUN = sd,
      width = window) %&gt;%
      na.omit() %&gt;%
      `colnames&lt;-`("rolling_sd")

tail(port_rolling_sd_xts, 6)
```

# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> VaR


.pull-left[

&lt;br&gt;
&lt;br&gt;

El Valor en Riesgo (VaR) es una de las medidas utilizadas para evaluar el riesgo de una determinada posición o cartera de activos financieros.

&lt;br&gt;

La definición del VaR puede hacerse en términos de **rentabilidades** o en términos de **Pérdidas y Ganancias** (términos nominales).

]


.pull-right[

![](https://media.giphy.com/media/d5FbeKADxF3CSf7y1L/giphy.gif)



]



---


class: center, middle



# El VaR responde entonces a la pregunta:



### ¿Cuál es la caída o pérdida que se podría sufrir en condiciones normales de mercado en un intervalo de tiempo y con cierto nivel de probabilidad o de confianza?




---


class: center, middle

## Es decir, indica la probabilidad (normalmente 1% o 5%) de sufrir una determinada pérdida durante un periodo de tiempo (normalmente 1 día, 1 semana o 1 mes).

--

&lt;br&gt;

## Una interpretación equivalente es:

--

&lt;br&gt;

### Con probabilidad `$$1- \alpha$$` el propietario de dicha posición experimentará una pérdida no superior al VaR.

---

# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> VaR

.pull-left[

Ejemplo:

&lt;br&gt;

&gt; Una entidad financiera podría considerar que el **VaR** diario de una cartera operativa es de 50 millones de euros, con un nivel de confianza del 90%. 

&lt;br&gt;

----

&lt;br&gt;

&gt; Esto quiere decir que solamente hay 1 posibilidad en 10, en condiciones normales de mercado, de que haya una pérdida superior a los 50 millones de euros.

]


.pull-right[


![](https://media.giphy.com/media/KDtXdzo3vBx5e1HcjU/giphy.gif)


]


---

# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> VaR


&lt;img src="img/Imagen2.png" width="50%" style="display: block; margin: auto;" /&gt;

.center[

### Por consiguiente, el VaR no es sino un determinado percentil de la distribución de probabilidad prevista para las variaciones en el valor de mercado de la cartera en el horizonte de tiempo escogido.

]

---

# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Cálculo del VaR


## Tipos de VaR


- **VaR Histórico, No Paramétrico:** se encuentra el `\(\alpha\)` percentil de la distribución histórica de los datos.

&lt;br/&gt;

- **VaR Paramétrico:** se calcula el VaR con base en un modelo que describe su función de densidad de las pérdidas. La cual debe ser estimada.
  - VaR suponiendo que las pérdidas siguen una distribución Gaussiana no condicional.

  - VaR modelando los valores futuros de la media y la varianza condicionales.

  - VaR por simulación de Montecarlo (estimando la función multivariada que describe los datos, por ejemplo mediante cópulas)



---






# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Cálculo del VaR


## Tipos de VaR: Método No Paramétrico - Histórico



.pull-left[

- No precisa hacer supuestos acerca de la forma paramétrica de la distribución de rentabilidades de los factores de riesgo o de la cartera.

- No está limitado a carteras en las que los pagos tienen una estructura lineal.

- El método histórico debe utilizarse solo para el cálculo del VaR a un horizonte de muy pocos días.


]


.pull-right[

`$$VaR_{(1-\alpha)} = q_{(1-\alpha)(R)}  \nonumber$$`

]



---



# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Cálculo del VaR


## Tipos de VaR: Método Paramétrico - Distribución Gaussiana


.pull-left[

- Suponemos que la distribución de las rentabilidades de los factores sigue una distribución Normal multivariante y la cartera es función lineal de los factores.

- Su ventaja es que es tratable analíticamente, pero solo se puede generalizar a una pocas formas paramétricas, como la Normal, la t-Student, o mixturas de Normales o de t-Student.




]


.pull-right[


.center[
Como `\(\alpha\)` es un valor reducido: 5%, 1% o 0.01%, entonces `\(R^*\)` será una rentabilidad negativa, y el VaR se proporciona cambiando el signo.
]


`$$VaR = -R^{\*} \Rightarrow \alpha = P(R&lt;R^{\*}) = \Phi\left( \frac{R^{\*}-\mu_R}{\sigma_R} \right) \nonumber$$`

`$$VaR_{(1-\alpha)} = \Phi^{-1}(1-\alpha) \sigma_R - \mu_R  \nonumber$$`




]

---



# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Cálculo del VaR


## Tipos de VaR: Método de normalidad estático


`$$VaR_{(1-\alpha)} = \Phi^{-1}(1-\alpha) \sigma_R - \mu_R  \nonumber$$`


## Tipos de VaR: Método de normalidad condicional


`$$VaR_{(1-\alpha),t+1} = \Phi^{-1}(1-\alpha) \sigma_{R,t+1} - \mu_{R,t+1}  \nonumber$$`



- Estimación de `\(\mu_{t+1}\)`: Modelos ARIMA de series de tiempo
- Estimación de `\(\sigma_{t+1}\)`: Modelos de varianza condicional:
  - Modelos GARCH: como un ARMA sobre la varianza con algunas restricciones.
  - Modelos de Volatilidad Estocástica: una versión más general de los GARCH.





---


# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Cálculo del VaR


## Tipos de VaR: Método de simulación MonteCarlo - estático


`$$VaR_{(1-\alpha)} = \sigma_R(-q_{(1-\alpha)}(Z))  - \mu_R, \quad \quad Z\sim N(0,1)  \nonumber$$`


## Tipos de VaR: Método de simulación MonteCarlo - dinámico


`$$VaR_{(1-\alpha)} = \sigma_{R,t+1}(-q_{(1-\alpha)}(Z))  - \mu_{R,t+1}, \quad \quad Z\sim N(0,1)  \nonumber$$`

---

# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Limitaciones


.pull-left[

Como se puede observar existen diversas metodologías, con diferentes niveles de precisión, para estimar el Valor en Riesgo. No obstante, todas estas metodologías presentan limitaciones generales, que caracterizan la técnica del VaR y que por ende son imposibles de evitar sin recurrir a otras herramientas.


----

&gt; - Dice muy poco sobre los casos en las colas (pérdidas extremas).
&gt; - Puede crear estructuras perversas de incentivos (porque no se conoce la magnitud de las pérdidas que exceden las colas).

----

]

.pull-right[

![](https://media.giphy.com/media/giC1lIEz7iOIk5vp3U/giphy.gif)

]


---

# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Expected Shortfall (CVaR)


.pull-left[

Mientras que el **VaR estima lo máximo que se puede esperar perder** si un evento de pérdidas extremas no ocurre, es decir, la peor pérdida esperada en caso de una relativa regularidad financiera, el **ES (Expected Shortfall) indica cuánto se espera perder si un evento extremo efectivamente ocurre** (más allá del nivel de confianza del VaR, en las colas de la distribución).


----


`$$ES = E[R / ( R &lt; VaR )] \nonumber$$`

----

]

.pull-right[


&lt;img src="img/Imagen3.PNG" width="75%" style="display: block; margin: auto;" /&gt;


]


---

gbm_sim &lt;- function(periodos, close_prices, vector_returns) {
  # estimadores de mu y sigma
  mu &lt;- mean(vector_returns)
  sig &lt;- sd(vector_returns)
  fin &lt;- length(vector_returns)

  S[1] &lt;- sim_actual_values
  for (t in c(2:periodos) ) {
    new_S &lt;- S[t-1] * exp( (mu-(0.5*sig^2)) + sig * rnorm(1)   )
    S[t] &lt;- new_S
  } 
  return(S)

---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Modelo de Markowitz

&lt;br/&gt;

.center[
### Modelo pionero en teoría de portafolios: incorpora el trade-off entre rentabilidad esperada y riesgo.
]

&lt;br/&gt;

.pull-left[

**Supuestos generales:**

- Los inversionistas son racionales y aversos al riesgo.
- Las decisiones se toman con base en la media y la varianza de los rendimientos.
- La información es simétrica.
- No hay costos de transacción.
- No se permite venta en corto en la versión básica.
- Los pesos del portafolio agotan el presupuesto disponible.

]

.pull-right[

.center[

## Rentabilidad vs Riesgo

&lt;img src="https://media.giphy.com/media/JqKOU2VAUx9bt9K4PK/giphy.gif" width="40%" style="display: block; margin: auto;" /&gt;

]

]






---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Supuestos del modelo de Markowitz

.pull-left[

### 1. Inversionistas racionales y aversos al riesgo

- Se asume que los inversionistas toman decisiones de forma lógica.
- Entre dos portafolios con el mismo retorno esperado, preferirán el de menor riesgo.
- Y entre dos portafolios con el mismo riesgo, elegirán el de mayor retorno esperado.

]

.pull-right[

### 2. Decisiones basadas en media y varianza

- El inversionista resume su decisión en dos elementos:
  - la rentabilidad esperada,
  - y la variabilidad o riesgo.
- Por eso, el modelo compara portafolios usando:
  - `\(E(R_p)\)`
  - `\(\sigma_p^2\)` o `\(\sigma_p\)`

]

.center[
### En este enfoque, invertir bien significa balancear retorno y riesgo.
]

---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Supuestos del modelo de Markowitz

.pull-left[

### 3. Información simétrica

- Todos los inversionistas tienen acceso a la misma información relevante del mercado.
- No existen agentes con ventajas informativas sistemáticas.
- Esto implica que las decisiones se toman bajo un mismo conjunto de datos y expectativas comparables.

]

.pull-right[

### 4. No hay costos de transacción

- Se supone que comprar o vender activos no genera comisiones, impuestos ni otros costos.
- Así, el modelo se concentra únicamente en la relación entre riesgo y retorno.
- En la realidad, estos costos sí existen y pueden alterar la composición óptima del portafolio.

]

.center[
### Estos supuestos simplifican el problema para enfocarse en la lógica de la diversificación.
]

---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Supuestos del modelo de Markowitz

.pull-left[

### 5. No se permite venta en corto

- En la versión básica, los pesos del portafolio deben ser no negativos:
  
`$$w_i \geq 0$$`

- Esto significa que solo se puede invertir con recursos propios en los activos seleccionados.
- No se consideran posiciones apostando a la caída del precio de un activo.

]

.pull-right[

### 6. Los pesos agotan el presupuesto disponible

- La suma de los pesos del portafolio debe ser igual a 1:

`$$\sum_{i=1}^{n} w_i = 1$$`

- Esto implica que todo el capital disponible se distribuye entre los activos del portafolio.
- No queda dinero sin asignar y no se invierte más de lo que se tiene.

]

.center[
### En conjunto, estos supuestos permiten construir una versión básica y operativa del problema de optimización.
]



---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Modelo de Markowitz

.pull-left[

#### Rentabilidad esperada del portafolio

`$$E(R_p)=w_AE(R_A)+w_BE(R_B)$$`

Para \(n\) activos:

`$$E(R_p)=\sum_{i=1}^n w_iE(R_i)$$`


“La rentabilidad esperada del portafolio es el promedio ponderado de los rendimientos esperados de los activos que lo componen. Cada peso `\((w_i)\)` refleja la proporción del capital invertida en cada activo, por lo que los activos con mayor participación tienen mayor influencia sobre el retorno esperado total.”


]








.pull-right[


### Riesgo del portafolio con dos activos

`$$\sigma_p^2 = w_A^2\sigma_A^2 + w_B^2\sigma_B^2 + 2w_Aw_BCov(R_A,R_B)$$`

`$$Cov(R_A,R_B)=\rho_{A,B}\sigma_A\sigma_B$$`

`$$w_A+w_B=1$$`

"El riesgo del portafolio no depende solo del riesgo individual de cada activo, sino también de la covarianza entre ellos. Esto significa que la relación conjunta entre los rendimientos puede aumentar o reducir el riesgo total, lo que da origen al beneficio de la diversificación."



]

---



# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Modelo de Markowitz

.pull-left[

- La gráfica muestra las combinaciones posibles entre dos activos, A y B.
- Los extremos representan invertir el 100% en A o el 100% en B.
- Los puntos intermedios corresponden a portafolios formados por ambas inversiones.
- Cuando `\(\rho = 1\)`, la combinación sigue una línea recta y el beneficio de diversificar es prácticamente nulo.
- A medida que la correlación disminuye, la curva se desplaza hacia la izquierda.
- Esto indica que se puede alcanzar el mismo retorno esperado con un menor nivel de riesgo.
- Cuando `\(\rho = -1\)`, el efecto de la diversificación es máximo.

**Idea clave:**  
La diversificación es más efectiva cuando los activos no se mueven igual.


]








.pull-right[

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Diversificación y covarianza

- El riesgo del portafolio no depende solo del riesgo individual de cada activo.
- También depende de cómo se mueven los activos entre sí.
- Si la correlación entre activos es baja o negativa, el riesgo total puede disminuir.
- Por eso, un activo riesgoso por sí solo puede mejorar el perfil riesgo-retorno del portafolio.

.center[

### La diversificación funciona porque la covarianza importa.

]

---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Frontera de portafolios

- Curva XY: frontera de varianza mínima.
- Curva OX: frontera eficiente.
- Punto O: portafolio de varianza mínima global.
- La frontera eficiente contiene los portafolios que ofrecen:
  - el mayor retorno para un nivel de riesgo dado, o
  - el menor riesgo para un retorno esperado dado.

&lt;img src="img/Imagen5.PNG" width="50%" style="display: block; margin: auto;" /&gt;

---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Formulación 1: maximización del retorno

.pull-left[

`$$\max E(R_p)=\sum_{i=1}^n w_iE(R_i)$$`

sujeto a:

- Restricción de riesgo objetivo:

`$$\sigma_p^2=\sum_{i=1}^n\sum_{j=1}^n w_iw_j\sigma_{ij}=V^*$$`

- Restricción presupuestaria:

`$$\sum_{i=1}^n w_i=1$$`

- No negatividad:

`$$w_i\geq 0$$`

]

.pull-right[

**Interpretación:**

Se busca la combinación de activos que maximiza el retorno esperado, manteniendo fijo un nivel de riesgo \(V^*\).

Cada valor de \(V^*\) genera una composición distinta del portafolio.

]

---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Formulación 2: minimización del riesgo

.pull-left[

`$$\min \sigma_p^2=\sum_{i=1}^n\sum_{j=1}^n w_iw_j\sigma_{ij}$$`

sujeto a:

- Restricción de retorno objetivo:

`$$E(R_p)=\sum_{i=1}^n w_iE(R_i)=\mu^*$$`

- Restricción presupuestaria:

`$$\sum_{i=1}^n w_i=1$$`

- No negatividad:

`$$w_i\geq 0$$`

]

.pull-right[

**Interpretación:**

Se busca el portafolio de menor riesgo posible para alcanzar un retorno objetivo `\(\mu^*\)`.

La frontera eficiente surge al resolver este problema para distintos niveles de retorno esperado.

]

---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Interpretación económica

- Un portafolio eficiente domina a otro si ofrece más retorno con el mismo riesgo.
- O si ofrece menos riesgo para el mismo retorno.
- El inversionista elegirá sobre la frontera eficiente según su perfil de riesgo.
- Markowitz no selecciona un único portafolio universal:
  selecciona el mejor portafolio condicionado a las preferencias o restricciones del inversionista.

.center[
### No se trata de elegir activos aislados, sino combinaciones óptimas.
]

---

# <i class="fab fa-apple" role="presentation" aria-label="apple icon"></i> Aplicación práctica

**¿Para qué sirve este modelo?**

- Diseñar portafolios diversificados.
- Comparar combinaciones de activos según riesgo y retorno.
- Identificar el portafolio de mínima varianza global.
- Encontrar el portafolio tangente o de mayor Sharpe.
- Servir como base para modelos posteriores como CAPM y optimización con restricciones adicionales.

# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Código en R

.scroll-output[


```r
# Markowitz


# =========================================================
# LIBRERÍAS
# =========================================================
# quantmod: descarga y manejo de datos financieros
# timeSeries: convierte los datos al formato requerido por fPortfolio
# fPortfolio: construye la frontera eficiente y portafolios óptimos
# caTools: utilidades varias (aunque en este script no se usa directamente)
# dplyr: manipulación de datos
# PerformanceAnalytics: cálculo de retornos y métricas financieras
# ggplot2: visualización de resultados

library("quantmod")
library("timeSeries")
library("fPortfolio")
library("caTools")
library("dplyr")
library("PerformanceAnalytics")
library("ggplot2")


###########################################################
###################### PASOS PREVIOS ######################
###########################################################

# Vector con los tickers de las acciones seleccionadas.
# Cada ticker representa un activo financiero que hará parte del portafolio.
tickers &lt;- c("TSLA", "NEM", "NFLX", "BAC", "AMZN", "JNJ")


# ---------------------------------------------------------
# DESCARGA DE PRECIOS
# ---------------------------------------------------------
# Se crea un objeto vacío donde se almacenarán los precios
# de cierre de cada una de las acciones.
PrecPort &lt;- NULL

# Recorremos el vector de tickers y descargamos los precios
# desde Yahoo Finance a partir del 1 de enero de 2019.
# El argumento auto.assign = FALSE evita que cada serie se
# guarde automáticamente en el entorno de trabajo.
# [,4] selecciona la cuarta columna del objeto descargado,
# que corresponde al precio de cierre.
for (Ticker in tickers)
  PrecPort &lt;- cbind(PrecPort, getSymbols(Ticker, from = '2019-01-01',
                                         auto.assign = FALSE)[,4])

# Visualización de la matriz de precios
PrecPort


# ---------------------------------------------------------
# ORGANIZACIÓN DE LA BASE
# ---------------------------------------------------------
# Se renombran las columnas de la matriz de precios con los
# tickers de las acciones seleccionadas.
colnames(PrecPort) &lt;- tickers


# ---------------------------------------------------------
# CÁLCULO DE RETORNOS
# ---------------------------------------------------------
# Se calculan los retornos discretos de cada activo.
# ROC mide la variación porcentual entre un periodo y el siguiente.
# na.omit elimina el primer valor faltante generado por el cálculo.
RetPort &lt;- na.omit(ROC(PrecPort, type = "discrete"))

# Visualización de los retornos
RetPort


# ---------------------------------------------------------
# CONVERSIÓN A timeSeries
# ---------------------------------------------------------
# La librería fPortfolio trabaja mejor con objetos de clase
# timeSeries, por eso convertimos la matriz de retornos.
RetPort &lt;- as.timeSeries(RetPort)

# Visualización final de los retornos en formato timeSeries
RetPort


###############################################################################
###################### FRONTERA Y PORTAFOLIOS EFICIENTES ######################
###############################################################################

# ---------------------------------------------------------
# CÁLCULO DE LA FRONTERA EFICIENTE
# ---------------------------------------------------------
# Se estima la frontera eficiente usando los retornos históricos.
# constraints = "LongOnly" impone la restricción de no venta en corto,
# es decir, todos los pesos del portafolio deben ser no negativos.
fronteraEff &lt;- portfolioFrontier(RetPort, constraints = "LongOnly")


# ---------------------------------------------------------
# GRÁFICOS DE LA FRONTERA
# ---------------------------------------------------------
# En el gráfico pueden incorporarse varios elementos:
# 1: Frontera eficiente
# 2: Portafolio de mínima varianza global
# 3: Línea tangente al portafolio
# 4: Riesgo y retorno de cada activo
# 5: Portafolio con pesos iguales
# 6: Fronteras de dos activos
# 7: Portafolios simulados por Monte Carlo
# 8: Ratio de Sharpe

# Gráfico con algunos elementos básicos de interés
plot(fronteraEff, c(1,2,3))

# Gráfico general por defecto
plot(fronteraEff)


# ---------------------------------------------------------
# PUNTOS DE RIESGO Y RETORNO DE LA FRONTERA
# ---------------------------------------------------------
# Se extraen los pares de riesgo-retorno que conforman la
# frontera eficiente. Esto puede ser útil para análisis posteriores.
Riesgo_Retorno &lt;- frontierPoints(fronteraEff)



# ---------------------------------------------------------
# MATRICES DE CORRELACIÓN Y COVARIANZA
# ---------------------------------------------------------
# La matriz de correlación permite observar qué tan relacionados
# están los movimientos de los activos.
MatrizCorr &lt;- cor(RetPort)

# La matriz de covarianza es clave en Markowitz, pues recoge
# no solo la volatilidad individual de cada activo sino también
# cómo se mueven conjuntamente.
MatrizCov &lt;- cov(RetPort)

# Mostrar ambas matrices
MatrizCov
MatrizCorr


# ---------------------------------------------------------
# PESOS DE LOS PORTAFOLIOS SOBRE LA FRONTERA EFICIENTE
# ---------------------------------------------------------
# Se extraen los pesos de los activos para cada portafolio
# perteneciente a la frontera eficiente.
fronteraPesos &lt;- getWeights(fronteraEff)

# Renombramos columnas con los tickers
colnames(fronteraPesos) &lt;- tickers

# Se construye un gráfico de barras apiladas para visualizar
# cómo cambian los pesos de las acciones a lo largo de la frontera.
barplot(t(fronteraPesos),
        main = "Pesos de los activos en la Frontera Eficiente",
        col = cm.colors(ncol(fronteraPesos) + 2),
        legend = colnames(fronteraPesos))


###########################################################
#################### PUNTOS INTERESANTES ##################
###########################################################

# ---------------------------------------------------------
# PORTAFOLIO DE VARIANZA MÍNIMA GLOBAL
# ---------------------------------------------------------
# Este portafolio corresponde al punto de la frontera
# que tiene el menor nivel de riesgo posible.
VMG &lt;- minvariancePortfolio(RetPort,
                            spec = portfolioSpec(),
                            constraints = "LongOnly")

# Resumen del portafolio de varianza mínima global
VMG


#Covariance Risk Budgets: aporte de cada activo al riesgo total del portafolio, medido desde la estructura de covarianza.
#Target Returns and Risks: resumen de desempeño del portafolio

# ---------------------------------------------------------
# PESOS DEL PORTAFOLIO DE VARIANZA MÍNIMA GLOBAL
# ---------------------------------------------------------
# Extraemos los pesos asignados a cada activo dentro del VMG.
VMG_Pesos &lt;- getWeights(VMG)

# Convertimos los pesos en data.frame para facilitar el gráfico.
DF_VMG_Pesos &lt;- data.frame(VMG_Pesos)

# Guardamos los nombres de las acciones
acciones &lt;- colnames(fronteraPesos)

# Gráfico de barras con los pesos del portafolio de mínima varianza
ggplot(data = DF_VMG_Pesos, aes(x = acciones, y = VMG_Pesos, fill = acciones)) +
  geom_bar(stat = "identity", position = position_dodge(), colour = "black") +
  geom_text(aes(label = sprintf("%.02f %%", VMG_Pesos * 100)),
            position = position_dodge(width = 0.9),
            vjust = -0.25,
            check_overlap = TRUE) +
  ggtitle("Pesos de las acciones del portafolio de varianza mínima global") +
  theme(plot.title = element_text(hjust = 0.5)) +
  labs(x = "Acciones", y = "Pesos (%)")


# ---------------------------------------------------------
# PORTAFOLIO TANGENTE
# ---------------------------------------------------------
# Este portafolio es el que maximiza la relación retorno/riesgo,
# es decir, el mayor Ratio de Sharpe dentro del conjunto eficiente.
# En teoría, corresponde al punto donde la Línea de Mercado de Capitales
# es tangente a la frontera eficiente.
LMC &lt;- tangencyPortfolio(RetPort,
                         spec = portfolioSpec(),
                         constraints = "LongOnly")

# Resumen del portafolio tangente
LMC

# El portafolio tangente busca el mejor balance entre ganar más
# y asumir menos riesgo. En otras palabras, identifica el portafolio
# que ofrece la mayor recompensa por cada unidad de riesgo tomada.


# ---------------------------------------------------------
# PESOS DEL PORTAFOLIO TANGENTE
# ---------------------------------------------------------
# Extraemos los pesos del portafolio tangente.
LMC_Pesos &lt;- getWeights(LMC)

# Convertimos a data.frame para graficar
DF_LMC_Pesos &lt;- data.frame(LMC_Pesos)

# Nombres de las acciones
acciones &lt;- colnames(fronteraPesos)

# Gráfico de barras con la composición del portafolio tangente
ggplot(data = DF_LMC_Pesos, aes(x = acciones, y = LMC_Pesos, fill = acciones)) +
  geom_bar(stat = "identity", position = position_dodge(), colour = "black") +
  geom_text(aes(label = sprintf("%.02f %%", LMC_Pesos * 100)),
            position = position_dodge(width = 0.9),
            vjust = -0.25,
            check_overlap = TRUE) +
  ggtitle("Pesos de las acciones del portafolio tangente") +
  theme(plot.title = element_text(hjust = 0.5)) +
  labs(x = "Acciones", y = "Pesos (%)")
```

# <i class="far fa-circle" role="presentation" aria-label="circle icon"></i> Nota final

- El modelo de Markowitz constituye la base de la teoría moderna de portafolios.
- Su principal aporte es mostrar que el riesgo de una cartera depende no solo del riesgo individual de cada activo, sino también de su relación conjunta.
- En la práctica, es una herramienta útil para entender diversificación, frontera eficiente y asignación óptima de pesos.

.center[
### Diversificar no es invertir en muchos activos, sino combinarlos inteligentemente.
]
